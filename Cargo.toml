[package]
name = "stella-mcp"
version = "0.1.0"
edition = "2024"
description = "An MCP server for running and debugging Atari 2600 (VCS) games with the Stella emulator"
authors = ["Enzo Lombardi <enzinol@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/aovestdipaperino/stella-mcp"
readme = "README.md"
keywords = ["mcp", "atari", "stella", "emulator", "debugger"]
categories = ["emulators", "development-tools"]

[dependencies]
rmcp = { version = "1.7", features = ["transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
base64 = "0.22"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
