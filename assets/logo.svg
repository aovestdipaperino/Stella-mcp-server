<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="stella-mcp: Atari 2600 debugging over MCP">
  <title>stella-mcp</title>
  <!-- Atari black badge -->
  <rect x="0" y="0" width="760" height="300" rx="28" fill="#0B0B0B"/>

  <!-- Atari "Fuji" mark: straight center bar, side bands flaring out at the base -->
  <g transform="translate(58,42) scale(0.56)" fill="#E4002B">
    <!-- left band -->
    <path d="M200,40 L160,40 C158,170 132,300 80,340 L180,340 C186,300 198,170 200,40 Z"/>
    <!-- center bar -->
    <rect x="212" y="40" width="56" height="300"/>
    <!-- right band -->
    <path d="M280,40 L320,40 C322,170 348,300 400,340 L300,340 C294,300 282,170 280,40 Z"/>
  </g>

  <!-- MCP wordmark -->
  <text x="356" y="178" font-family="Helvetica, Arial, sans-serif" font-size="150" font-weight="800" letter-spacing="4" fill="#E4002B">MCP</text>

  <!-- tagline -->
  <text x="358" y="222" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="2" fill="#9A9A9A">ATARI 2600 DEBUGGING</text>
</svg>
