name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: build
        run: cargo build --release --locked

  emulator:
    name: Go helper (gofmt, vet, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: emu/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l emu)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: build helper
        run: bash scripts/build-emu.sh
      - name: go vet
        working-directory: emu
        run: go vet ./...

  smoke:
    name: Smoke test (build ROM + screenshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: emu/go.sum
      - name: install dasm
        run: sudo apt-get update && sudo apt-get install -y dasm
      - name: build helper
        run: bash scripts/build-emu.sh
      - name: build server
        run: cargo build --release --locked
      - name: smoke test
        run: python3 scripts/smoke.py
      - name: upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshot
          path: target/smoke/colorbars.png
          if-no-files-found: ignore
